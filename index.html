<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Tetris Bitboard</title>
  <style>
    body {
      background: #708860;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Courier New', monospace;
    }
    canvas {
      background: #c8e0c8; /* Couleur Game Boy */
      display: block;
      image-rendering: pixelated;
      border: 10px solid #8b9570;
      border-radius: 2px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }
    .container {
      text-align: center;
    }
    .controls {
      margin-top: 10px;
      color: white;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <canvas id="tetris" width="160" height="384"></canvas>
    <div class="controls">
      ← → : Déplacer | ↓ : Accélérer | Z : Tourner
    </div>
  </div>

  <script>
    const canvas = document.getElementById('tetris');
    const ctx = canvas.getContext('2d');

    const COLS = 10;
    const ROWS = 24;
    const TILE = 16;
    canvas.width = COLS * TILE;
    canvas.height = ROWS * TILE;

    // Représentation des pièces en un seul entier 16-bit
    // Format: 4 bits par ligne, 4 lignes = 16 bits
    const SHAPES = {
      I: 0x0F00, // 0000 | 1111 | 0000 | 0000
      O: 0x6600, // 0110 | 0110 | 0000 | 0000
      T: 0x4E00, // 0100 | 1110 | 0000 | 0000
      S: 0x6C00, // 0110 | 1100 | 0000 | 0000
      Z: 0xC600, // 1100 | 0110 | 0000 | 0000
      J: 0x8E00, // 1000 | 1110 | 0000 | 0000
      L: 0x2E00  // 0010 | 1110 | 0000 | 0000
    };

    const COLORS = {
      I: '#0ff', O: '#ff0', T: '#f0f', S: '#0f0',
      Z: '#f00', J: '#00f', L: '#fa0'
    };

    // La grille est un tableau de 24 entiers sur 16 bits (seuls 10 bits sont utilisés)
    let grid = new Array(ROWS).fill(0);
    let score = 0;

    // Extraire une ligne d'une pièce (0-3 en partant du haut)
    function getRow(shape, row) {
      // Décalage de (12 - row*4) bits vers la droite et masque avec 0xF
      return (shape >> (12 - row*4)) & 0xF;
    }

    function createPiece(type) {
      return {
        shape: SHAPES[type],
        color: COLORS[type],
        x: 3, // Position centrée
        y: 0
      };
    }

    let piece = createPiece(randomType());
    let dropCounter = 0;
    let dropInterval = 500;
    let lastTime = 0;

    function randomType() {
      return Object.keys(SHAPES)[Math.floor(Math.random() * 7)];
    }

    // Dessiner un bloc simple
    function drawTile(x, y, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x * TILE, y * TILE, TILE, TILE);
      ctx.strokeStyle = '#111';
      ctx.strokeRect(x * TILE, y * TILE, TILE, TILE);

      // Effet Game Boy : ombre intérieure
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.fillRect(x * TILE, y * TILE, TILE-2, 2);
      ctx.fillRect(x * TILE, y * TILE, 2, TILE-2);

      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.fillRect(x * TILE + 2, y * TILE + TILE - 2, TILE-2, 2);
      ctx.fillRect(x * TILE + TILE - 2, y * TILE + 2, 2, TILE-2);
    }

    // Dessiner une matrice de bits
    function drawBitboard(board, offsetX, offsetY, color) {
      for (let y = 0; y < board.length; y++) {
        let row = board[y];
        // Parcourir chaque bit de la ligne (de droite à gauche)
        for (let x = 0; x < COLS; x++) {
          // Vérifier si le bit est activé (1 << x effectue un décalage de 1 bit de x positions)
          if (row & (1 << x)) {
            drawTile(offsetX + x, offsetY + y, color);
          }
        }
      }
    }

    // Version corrigée de la fonction de collision
    function collide(grid, piece) {
      for (let y = 0; y < 4; y++) {
        let rowY = piece.y + y;

        // Extraire la ligne y de la pièce
        let pieceRow = getRow(piece.shape, y);
        if (pieceRow === 0) continue; // Ligne vide

        // Si la pièce est en partie au-dessus de la grille, on continue
        if (rowY < 0) continue;

        // Si la pièce touche le fond de la grille
        if (rowY >= ROWS) return true;

        // Si la pièce est trop à gauche (x < 0)
        if (piece.x < 0) {
          // Vérifier si des bits actifs dépassent à gauche
          // Par exemple, pour la pièce I, si x = -1, seuls les 3 bits de droite peuvent être dans la grille
          let maxVisibleBits = 4 + piece.x; // Combien de bits peuvent être dans la grille
          let leftBits = pieceRow & (0xF << maxVisibleBits); // Bits qui dépassent à gauche

          if (leftBits) return true; // S'il y a des bits actifs qui dépassent à gauche

          // Décaler vers la droite pour compenser et vérifier la collision avec la grille
          let visibleBits = pieceRow & ((1 << maxVisibleBits) - 1); // Obtenir uniquement les bits visibles
          let adjustedBits = visibleBits << (COLS - maxVisibleBits); // Positionner correctement ces bits

          if (adjustedBits & grid[rowY]) return true;
        }
        // Si la pièce est dans la grille ou dépasse à droite
        else {
          // Vérifier si la pièce dépasse sur la droite
          if (piece.x + 4 > COLS) {
            let rightBits = pieceRow & ((1 << (piece.x + 4 - COLS)) - 1); // Bits qui dépassent à droite
            if (rightBits) return true; // S'il y a des bits actifs qui dépassent à droite
          }

          // Décaler la ligne de la pièce à sa position X
          let adjustedPieceRow = pieceRow << piece.x;

          // Vérifier la collision avec des blocs existants
          if (adjustedPieceRow & grid[rowY]) return true;
        }
      }
      return false;
    }

    // Fusionner la pièce avec la grille
    function merge(grid, piece) {
      for (let y = 0; y < 4; y++) {
        if (piece.y + y >= 0 && piece.y + y < ROWS) {
          // Extraire la ligne y de la pièce
          let pieceRow = getRow(piece.shape, y);

          // Si la pièce est trop à gauche (x < 0)
          if (piece.x < 0) {
            let maxVisibleBits = 4 + piece.x; // Combien de bits peuvent être dans la grille
            let visibleBits = pieceRow & ((1 << maxVisibleBits) - 1); // Obtenir uniquement les bits visibles
            grid[piece.y + y] |= (visibleBits << (COLS - maxVisibleBits));
          }
          // Si la pièce est dans la grille ou dépasse à droite
          else {
            let adjustedPieceRow = pieceRow << piece.x;
            // Ne conserver que les bits qui sont dans la grille
            adjustedPieceRow &= ((1 << COLS) - 1);
            grid[piece.y + y] |= adjustedPieceRow;
          }
        }
      }
    }

    // Rotation de la pièce en utilisant uniquement des opérations bitwise
    function rotate(shape) {
      let result = 0;

      // Pour chaque position de bit dans la grille 4x4
      for (let y = 0; y < 4; y++) {
        for (let x = 0; x < 4; x++) {
          // Calculer la position du bit dans l'entier 16-bit
          let fromPos = y * 4 + x;
          // Calculer la nouvelle position après rotation (90° sens horaire)
          let toPos = x * 4 + (3 - y);

          // Si le bit original est activé, l'activer dans le résultat
          if (shape & (1 << (15 - fromPos))) {
            result |= (1 << (15 - toPos));
          }
        }
      }

      return result;
    }

        function drop() {
      piece.y++;

      if (collide(grid, piece)) {
        // La pièce a touché quelque chose
        piece.y--; // On annule le mouvement

        // On sauvegarde temporairement l'état actuel de la pièce
        const currentShape = piece.shape;
        const currentX = piece.x;
        const currentY = piece.y;

        // On fusionne la pièce avec la grille
        merge(grid, piece);

        // Vérifier et effacer les lignes complètes
        const linesCleared = clearLines();
        score += linesCleared * 100;

        // Créer une nouvelle pièce *après* avoir fusionné l'ancienne
        piece = createPiece(randomType());

        // Vérifier si la nouvelle pièce est en collision (Game Over)
        if (collide(grid, piece)) {
          alert("Game Over - Score: " + score);
          grid.fill(0); // Réinitialiser la grille
          score = 0;
        }
      }
    }

    // Vérifier et effacer les lignes complètes
    function clearLines() {
      const fullRow = 0b1111111111; // 10 bits à 1
      let linesCleared = 0;

      for (let y = ROWS - 1; y >= 0; y--) {
        // Si tous les 10 premiers bits sont à 1
        if ((grid[y] & fullRow) === fullRow) {
          linesCleared++;

          // Supprimer cette ligne en décalant toutes les lignes au-dessus
          for (let yy = y; yy > 0; yy--) {
            grid[yy] = grid[yy - 1];
          }
          grid[0] = 0; // La ligne du haut devient vide
          y++; // Réévaluer cette position car une nouvelle ligne y est descendue
        }
      }

      return linesCleared;
    }

    function update(time = 0) {
      const delta = time - lastTime;
      lastTime = time;
      dropCounter += delta;

      if (dropCounter > dropInterval) {
        drop();
        dropCounter = 0;
      }

      // Effacer le canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Dessiner la grille en utilisant drawBitboard
      drawBitboard(grid, 0, 0, '#aaaaaa');

      // Dessiner la pièce active
      for (let y = 0; y < 4; y++) {
        let pieceRow = getRow(piece.shape, y);

        for (let x = 0; x < 4; x++) {
          if (pieceRow & (1 << (3-x))) { // Note: inversion pour la correspondance visuelle
            // Vérifier si le bloc est dans les limites du canvas
            if (piece.x + x >= 0 && piece.x + x < COLS && piece.y + y >= 0) {
              drawTile(piece.x + x, piece.y + y, piece.color);
            }
          }
        }
      }

      // Afficher le score
      ctx.fillStyle = "#000";
      ctx.font = "12px monospace";
      ctx.fillText("Score: " + score, 4, 12);

      requestAnimationFrame(update);
    }

    document.addEventListener("keydown", e => {
      if (e.key === "ArrowLeft") {
        piece.x--;
        if (collide(grid, piece)) piece.x++;
      }
      if (e.key === "ArrowRight") {
        piece.x++;
        if (collide(grid, piece)) piece.x--;
      }
      if (e.key === "ArrowDown") {
        drop();
        dropCounter = 0;
      }
      if (e.key === "z") {
        const oldShape = piece.shape;
        const oldX = piece.x;
        const oldY = piece.y;

        piece.shape = rotate(piece.shape);

        // Correction de l'excentrement pour certaines pièces
        // Tester différentes positions pour trouver une valide après rotation
        const positions = [0, -1, 1, -2, 2];

        let rotationSucceeded = false;

        for (let i = 0; i < positions.length; i++) {
          piece.x += positions[i];

          if (!collide(grid, piece)) {
            rotationSucceeded = true;
            break;
          }

          piece.x -= positions[i];
        }

        if (!rotationSucceeded) {
          // Si aucune position ne fonctionne, annuler la rotation
          piece.shape = oldShape;
          piece.x = oldX;
          piece.y = oldY;
        }
      }
    });

    update();
  </script>
</body>
</html>
