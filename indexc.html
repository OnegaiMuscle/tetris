<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Tetris Bitboard</title>
  <style>
    canvas {
      background: #c8e0c8; /* Couleur Game Boy */
      display: block;
      margin: 20px auto;
      image-rendering: pixelated;
      border: 10px solid #8b9570;
    }
  </style>
</head>
<body>
  <canvas id="tetris" width="160" height="384"></canvas>

  <script>
    const canvas = document.getElementById('tetris');
    const ctx = canvas.getContext('2d');

    const COLS = 10;
    const ROWS = 24;
    const TILE = 16;
    canvas.width = COLS * TILE;
    canvas.height = ROWS * TILE;

    // Représentation des pièces en bitboards (4x4 bits max)
    // Chaque ligne est représentée par un nombre entier
    const SHAPES = {
      I: [0b0000, 0b1111, 0b0000, 0b0000], // ---- | #### | ---- | ----
      O: [0b0110, 0b0110, 0b0000, 0b0000], // -##- | -##- | ---- | ----
      T: [0b0100, 0b1110, 0b0000, 0b0000], // -#-- | ###- | ---- | ----
      S: [0b0110, 0b1100, 0b0000, 0b0000], // -##- | ##-- | ---- | ----
      Z: [0b1100, 0b0110, 0b0000, 0b0000], // ##-- | -##- | ---- | ----
      J: [0b1000, 0b1110, 0b0000, 0b0000], // #--- | ###- | ---- | ----
      L: [0b0010, 0b1110, 0b0000, 0b0000]  // --#- | ###- | ---- | ----
    };

    
    const COLORS = {
      I: '#0ff', O: '#ff0', T: '#f0f', S: '#0f0',
      Z: '#f00', J: '#00f', L: '#fa0'
    };

    // La grille est un tableau de 24 entiers sur 16 bits (seuls 10 bits sont utilisés)
    // Chaque ligne est un entier 16-bit où les 10 bits de poids faible représentent les colonnes
    let grid = new Array(ROWS).fill(0);

    function createPiece(type) {
      return {
        shape: SHAPES[type],
        color: COLORS[type],
        x: 3, // Position centrée
        y: 0
      };
    }

    let piece = createPiece(randomType());
    let dropCounter = 0;
    let dropInterval = 500;
    let lastTime = 0;

    function randomType() {
      return Object.keys(SHAPES)[Math.floor(Math.random() * 7)];
    }

    // Dessiner un bloc simple
    function drawTile(x, y, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x * TILE, y * TILE, TILE, TILE);
      ctx.strokeStyle = '#111';
      ctx.strokeRect(x * TILE, y * TILE, TILE, TILE);
    }

    // Dessiner une pièce ou la grille à partir d'un bitboard
    function drawBitboard(board, offsetX, offsetY, color) {
      for (let y = 0; y < board.length; y++) {
        let row = board[y];
        // Parcourir chaque bit de la ligne (de droite à gauche)
        for (let x = 0; x < 10; x++) {
          // Vérifier si le bit est activé (1 << x effectue un décalage de 1 bit de x positions)
          if (row & (1 << x)) {
            drawTile(offsetX + x, offsetY + y, color);
          }
        }
      }
    }

    // Vérifier si la pièce entre en collision avec la grille ou les bords
    function collide(grid, piece) {
      for (let y = 0; y < 4; y++) {
        // Pour chaque ligne de la pièce
        let rowY = piece.y + y;
        if (rowY < 0) continue; // Ignorer les lignes au-dessus de la grille

        // Calculer la position effective de la ligne de la pièce dans la grille
        // Décaler la ligne de la pièce de 'piece.x' bits vers la gauche
        let shiftedPieceRow = piece.shape[y] << piece.x;

        if (rowY >= ROWS) {
          // Collision avec le bas de la grille
          if (piece.shape[y] !== 0) return true;
          continue;
        }

        // Vérifier si la pièce dépasse les bords latéraux
        if ((shiftedPieceRow & 0b1111111111111111) !== shiftedPieceRow) {
          return true; // La pièce dépasse à droite ou à gauche
        }

        // Vérifier la collision avec des blocs existants
        if ((shiftedPieceRow & grid[rowY]) !== 0) {
          return true; // Collision détectée
        }
      }
      return false;
    }

    // Fusionner la pièce avec la grille
    function merge(grid, piece) {
      for (let y = 0; y < 4; y++) {
        if (piece.y + y >= 0 && piece.y + y < ROWS) {
          // Décaler la ligne de la pièce à sa position X et l'ajouter à la grille avec OR bitwise
          grid[piece.y + y] |= (piece.shape[y] << piece.x);
        }
      }
    }

    // Rotation de la pièce en utilisant des opérations bitwise
    function rotate(pieceShape) {
      let result = [0, 0, 0, 0];

      // Pour chaque bit dans la matrice 4x4
      for (let y = 0; y < 4; y++) {
        for (let x = 0; x < 4; x++) {
          // Si le bit est activé à la position (y, x)
          if (pieceShape[y] & (1 << x)) {
            // Activez le bit correspondant à la position (x, 3-y) dans le résultat
            result[x] |= (1 << (3 - y));
          }
        }
      }

      return result;
    }

    function drop() {
      piece.y++;
      if (collide(grid, piece)) {
        piece.y--;
        merge(grid, piece);
        clearLines();
        piece = createPiece(randomType());
        if (collide(grid, piece)) {
          alert("Game Over");
          grid.fill(0); // Réinitialiser la grille
        }
      }
    }

    // Vérifier et effacer les lignes complètes
    function clearLines() {
      const fullRow = 0b1111111111; // 10 bits à 1

      for (let y = ROWS - 1; y >= 0; y--) {
        // Si tous les 10 premiers bits sont à 1
        if ((grid[y] & fullRow) === fullRow) {
          // Supprimer cette ligne en décalant toutes les lignes au-dessus
          for (let yy = y; yy > 0; yy--) {
            grid[yy] = grid[yy - 1];
          }
          grid[0] = 0; // La ligne du haut devient vide
          y++; // Réévaluer cette position car une nouvelle ligne y est descendue
        }
      }
    }

    function update(time = 0) {
      const delta = time - lastTime;
      lastTime = time;
      dropCounter += delta;

      if (dropCounter > dropInterval) {
        drop();
        dropCounter = 0;
      }

      // Effacer le canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Dessiner la grille
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          // Vérifier si le bit correspondant est activé dans la ligne de la grille
          if (grid[y] & (1 << x)) {
            drawTile(x, y, '#aaaaaa'); // Couleur des blocs placés
          }
        }
      }

      // Dessiner la pièce active
      for (let y = 0; y < 4; y++) {
        for (let x = 0; x < 4; x++) {
          if (piece.shape[y] & (1 << x)) {
            drawTile(piece.x + x, piece.y + y, piece.color);
          }
        }
      }

      requestAnimationFrame(update);
    }

    document.addEventListener("keydown", e => {
      if (e.key === "ArrowLeft") {
        piece.x--;
        if (collide(grid, piece)) piece.x++;
      }
      if (e.key === "ArrowRight") {
        piece.x++;
        if (collide(grid, piece)) piece.x--;
      }
      if (e.key === "ArrowDown") {
        drop();
        dropCounter = 0;
      }
      if (e.key === "z") {
        const rotated = rotate(piece.shape);
        const old = piece.shape;
        piece.shape = rotated;
        if (collide(grid, piece)) piece.shape = old;
      }
    });

    update();
  </script>
</body>
</html>
